[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-brain-coherence"
version = "3.1.0"
description = "Slow wavelet coherence between heart period and EEG band envelopes, with the negative and positive controls of the study One Dataset, Three Verdicts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Osmar Pinto Neto", email = "osmar@csusm.edu"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8", "tqdm>=4.60", "pycwt"]

[project.optional-dependencies]
pipeline = ["h5py>=3.10", "mne>=1.8", "mne-icalabel>=0.7", "python-picard>=0.8", "onnxruntime>=1.18", "scikit-learn>=1.3"]

[project.urls]
Repository = "https://github.com/osmar235/Heart_Brain_Coherence"

[tool.setuptools.packages.find]
where = ["code/src"]
include = ["hb*"]
